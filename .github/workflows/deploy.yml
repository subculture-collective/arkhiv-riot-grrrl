name: Deploy
run-name: Deploy ${{ github.sha }}

# Deploys main to Almaz. The job joins the tailnet as tag:github-ci (Tailscale
# OAuth client in the TS_OAUTH_* organization secrets), then uses this
# repository's deploy key, which Almaz accepts only from tailnet addresses and
# only for the arkhiv-riot-grrrl fleet-deploy receiver.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run that may be mid-deployment.
  cancel-in-progress: false

env:
  TARGET: onnwee@100.77.128.80
  WEB_IMAGE: ghcr.io/subculture-collective/arkhiv-riot-grrrl-web
  API_IMAGE: ghcr.io/subculture-collective/arkhiv-riot-grrrl-api
  DEPLOY_REVISION: ${{ github.sha }}

jobs:
  deploy:
    name: Build images and deploy frontend and API
    if: github.repository == 'subculture-collective/arkhiv-riot-grrrl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: 1.104.7
          # The tailnet resolver is a LAN address this runner cannot reach;
          # keep the runner's own DNS so image and package pulls resolve.
          args: --accept-dns=false
      - name: Prepare the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
      - name: Reuse already accepted artifacts
        id: artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          d="$RUNNER_TEMP/deploy"
          ssh_args=(-F /dev/null -i "$d/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 "$TARGET")
          # The receiver deploys only Gitea's current main. Kvant copies GitHub
          # to Gitea every minute, so wait while the revision has not arrived.
          for attempt in $(seq 1 20); do
            # shellcheck disable=SC2029
            if ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION riot-public-web" > "$d/artifact.json" 2> "$d/err" &&
              ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION riot-public-api" > "$d/artifact-api.json" 2> "$d/err"; then break; fi
            if grep -q "no longer the current main" "$d/err" && [ "$attempt" -lt 20 ]; then
              echo "Gitea has not received $DEPLOY_REVISION yet; waiting 30 s ($attempt/20)"; sleep 30; continue
            fi
            cat "$d/err" >&2; exit 1
          done
          python3 - "$d/artifact.json" "$d/artifact-api.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          web = json.loads(Path(sys.argv[1]).read_text())
          api = json.loads(Path(sys.argv[2]).read_text())
          web_available = web.get("available") is True
          api_available = api.get("available") is True
          if web_available:
              assert re.fullmatch(r"[0-9a-f]{64}", web.get("html_sha256", ""))
          # A retry must not rebuild an image the receiver already accepted for
          # this commit: builds are not reproducible, so it would be refused.
          with Path(sys.argv[3]).open("a") as output:
              output.write("web=" + str(web_available).lower() + "\n")
              output.write("api=" + str(api_available).lower() + "\n")
              output.write("available=" + str(web_available and api_available).lower() + "\n")
          PYCODE
      - name: Build deployable images from the verified revision
        if: steps.artifact.outputs.available != 'true'
        run: |
          set -euo pipefail
          # On some runners DNS inside build containers fails for the whole job
          # (EAI_AGAIN), so RUN steps use the host network and its resolver; the
          # retry covers one-off registry or network errors.
          retry() { for wait in 30 60 0; do "$@" && return 0; [ "$wait" = 0 ] && return 1; echo "Build failed; retrying in ${wait}s" >&2; sleep "$wait"; done; }
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          export DOCKER_BUILDKIT=1
          # The fleet-deploy receiver identifies the application by this Gitea source label.
          retry docker build --network=host -f web/Dockerfile --build-arg CORE_UPSTREAM=riot-public-api:8080 --build-arg VITE_PUBLIC_URL=https://riot-grrrl.subcult.tv --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/arkhiv-riot-grrrl" -t "$WEB_IMAGE:$GITHUB_SHA" web
          retry docker build --network=host -f backend/Dockerfile --build-arg "ARKHIV_REVISION=$GITHUB_SHA" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/arkhiv-riot-grrrl" -t "$API_IMAGE:$GITHUB_SHA" .
          docker tag "$WEB_IMAGE:$GITHUB_SHA" "fleet-deploy/arkhiv-riot-grrrl/riot-public-web:$DEPLOY_REVISION"
          docker tag "$API_IMAGE:$GITHUB_SHA" "fleet-deploy/arkhiv-riot-grrrl/riot-public-api:$DEPLOY_REVISION"
          docker run --rm --network none --entrypoint nginx "$WEB_IMAGE:$GITHUB_SHA" -t
      - name: Publish the images to GitHub Packages
        if: steps.artifact.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in "$WEB_IMAGE:$GITHUB_SHA" "$API_IMAGE:$GITHUB_SHA"; do
            docker push "$image"
            echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          done
      - name: Deploy the built images and verify public HTML
        env:
          REUSE_WEB: ${{ steps.artifact.outputs.web }}
          REUSE_API: ${{ steps.artifact.outputs.api }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          d="$RUNNER_TEMP/deploy"
          ssh_args=(-F /dev/null -i "$d/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 "$TARGET")
          ssh "${ssh_args[@]}" status
          # The receiver deploys both services together and refuses until both
          # images for this revision have been received.
          if [[ "$REUSE_WEB" != true ]]; then
            # shellcheck disable=SC2029
            docker save "fleet-deploy/arkhiv-riot-grrrl/riot-public-web:$DEPLOY_REVISION" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION riot-public-web"
          fi
          if [[ "$REUSE_API" != true ]]; then
            # shellcheck disable=SC2029
            docker save "fleet-deploy/arkhiv-riot-grrrl/riot-public-api:$DEPLOY_REVISION" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION riot-public-api"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION riot-public-web" > "$d/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$d/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://riot-grrrl.subcult.tv/ > "$d/live.html"
          actual=$(sha256sum "$d/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
